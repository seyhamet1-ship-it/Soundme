# Soundme Nginx Reverse Proxy Configuration
# Aligned for 60-minute long video processing and up to 4096 MB chunked/direct uploads.

server {
    listen 80;
    server_name localhost;

    # Support up to 4096 MB uploads (matching MAX_UPLOAD_MB=4096)
    client_max_body_size 4096M;
    client_body_buffer_size 128M;
    client_body_timeout 3600s;
    client_header_timeout 3600s;

    # Gzip settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API and SSE proxying
    location /api/ {
        proxy_pass http://soundme-app:8000;
        proxy_http_version 1.1;

        # Disable buffering for SSE real-time progress streams
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long video processing (up to 2 hours)
        proxy_connect_timeout 300s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;
    }

    # Static assets and SPA frontend
    location / {
        proxy_pass http://soundme-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
