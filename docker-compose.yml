services:
  soundme-app:
    build: .
    container_name: soundme-app
    restart: unless-stopped
    environment:
      - MAX_DURATION_MIN=90
      - MAX_UPLOAD_MB=4096
      - ASR_MODEL=small
      - MAX_WORKERS=2
    volumes:
      - ./uploads:/app/uploads
      - ./jobs.sqlite3:/app/jobs.sqlite3
    expose:
      - "8000"

  reverse-proxy:
    image: nginx:alpine
    container_name: soundme-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - soundme-app
